name: Build Arch Package & AppImage (Git)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build with makepkg
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Install base dependencies
        run: |
          pacman -Syu --noconfirm archlinux-keyring
          pacman -Syu --noconfirm base-devel git sudo wget zsync xorg-server-xvfb patchelf

          # Enable multilib. Recent archlinux:latest containers no longer ship a
          # commented #[multilib] block, so append the section if absent.
          if ! grep -q '^\[multilib\]' /etc/pacman.conf; then
            cat >> /etc/pacman.conf <<'EOF'

          [multilib]
          Include = /etc/pacman.d/mirrorlist
          EOF
          fi

          sudo pacman -Syu --noconfirm

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fix permissions
        run: chown -R builder:builder .

      - name: Build package (makepkg -si)
        run: |
          sudo -u builder bash <<'EOF'
          set -e
          cd pkg/git
          makepkg -si --noconfirm
          cd ../AppImage/
          chmod +x AppImage.sh
          HEADLESS=1 ./AppImage.sh
          EOF

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: arch-package
          path: |
            pkg/git/*.pkg.tar.zst
            pkg/AppImage/dist/*.AppImage
